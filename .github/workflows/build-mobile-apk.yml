name: Build LeoTeleBot Mobile APK (on-phone bot)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['android_app/**', 'mobile/**', 'backend/**', '.github/workflows/build-mobile-apk.yml']

env:
  NODEJS_MOBILE_VERSION: v18.20.4

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKM=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin | sort -V | tail -n1)
          echo "$SDKM" >> $GITHUB_PATH
          yes | "$SDKM/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }

      - name: Build bot bundle from unchanged backend
        run: node mobile/build.mjs

      - name: Pack bundle into APK assets
        run: |
          mkdir -p android_app/app/src/main/assets
          cd mobile/dist && zip -qr ../../android_app/app/src/main/assets/nodebot.zip .

      - name: Download nodejs-mobile runtime
        run: |
          curl -fsSL -o /tmp/nm.zip "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/${NODEJS_MOBILE_VERSION}/nodejs-mobile-${NODEJS_MOBILE_VERSION}-android.zip"
          unzip -q /tmp/nm.zip -d /tmp/nm
          ROOT=$(dirname "$(find /tmp/nm -type d -name include | head -n1)")
          mkdir -p android_app/app/src/main/cpp/libnode android_app/app/src/main/jniLibs
          cp -r "$ROOT/include" android_app/app/src/main/cpp/libnode/
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p android_app/app/src/main/jniLibs/$abi
            cp "$ROOT/bin/$abi/libnode.so" android_app/app/src/main/jniLibs/$abi/
          done

      - name: Install NDK + CMake
        run: yes | sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" > /tmp/sdk.log || (tail -n 50 /tmp/sdk.log; exit 1)

      - name: Build APK
        working-directory: android_app
        run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LeoTeleBot-mobile-apk
          path: android_app/app/build/outputs/apk/release/*.apk
